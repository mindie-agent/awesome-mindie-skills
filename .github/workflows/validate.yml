name: Validate catalogue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_catalog.py
      - run: python scripts/render_catalog.py --check
      - run: python -m unittest discover -s skills/ascend-memcache-pooling/tests -v
